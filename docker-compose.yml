version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: quant-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${QUANT_DB_PASSWORD:-root}
      MYSQL_DATABASE: ${QUANT_DB_NAME:-quant_data}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "${QUANT_DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password

  web:
    build: .
    container_name: quant-web
    restart: unless-stopped
    ports:
      - "${QUANT_WEB_PORT:-8000}:8000"
    environment:
      QUANT_DB_HOST: mysql
      QUANT_DB_PORT: 3306
      QUANT_DB_USER: root
      QUANT_DB_PASSWORD: ${QUANT_DB_PASSWORD:-root}
      QUANT_DB_NAME: ${QUANT_DB_NAME:-quant_data}
      QUANT_ENV: ${QUANT_ENV:-production}
      QUANT_LOG_LEVEL: ${QUANT_LOG_LEVEL:-INFO}
      QUANT_SCHEDULER_ENABLED: "${QUANT_SCHEDULER_ENABLED:-true}"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config:ro

volumes:
  mysql_data:
