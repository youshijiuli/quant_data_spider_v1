<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Quant Data Spider{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.jade.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2/dist/htmx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    {% block head %}{% endblock %}
</head>
<body hx-ext="loading-states">
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h2>📊 QuantDS</h2>
                <small>量化数据管道</small>
            </div>
            <nav class="sidebar-nav">
                <a href="/" class="nav-item {% if request.url.path == '/' %}active{% endif %}">
                    <span class="nav-icon">🏠</span> 仪表盘
                </a>
                <a href="/data/stocks" class="nav-item {% if request.url.path.startswith('/data') %}active{% endif %}">
                    <span class="nav-icon">📋</span> 数据浏览
                </a>
                <a href="/charts" class="nav-item {% if request.url.path.startswith('/charts') %}active{% endif %}">
                    <span class="nav-icon">📈</span> 图表分析
                </a>
                <a href="/sync" class="nav-item {% if request.url.path.startswith('/sync') %}active{% endif %}">
                    <span class="nav-icon">🔄</span> 同步控制
                </a>
                <a href="/monitoring" class="nav-item {% if request.url.path.startswith('/monitoring') %}active{% endif %}">
                    <span class="nav-icon">🔔</span> 告警中心
                </a>
                <a href="/quality" class="nav-item {% if request.url.path.startswith('/quality') %}active{% endif %}">
                    <span class="nav-icon">✅</span> 数据质量
                </a>
                <a href="/scheduler" class="nav-item {% if request.url.path.startswith('/scheduler') %}active{% endif %}">
                    <span class="nav-icon">⏰</span> 定时任务
                </a>
            </nav>
            <div class="sidebar-footer">
                <small>v0.1.0</small>
            </div>
        </aside>
        <main class="main-content">
            <header class="topbar">
                <div class="breadcrumb">
                    {% block breadcrumb %}Home{% endblock %}
                </div>
                <div class="topbar-actions">
                    <span id="clock" class="clock">{{ request.timestamp | default('') }}</span>
                </div>
            </header>
            <div class="content-area">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
    <div id="toast-container" class="toast-container"></div>
    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
