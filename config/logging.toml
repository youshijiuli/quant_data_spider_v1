# Loguru configuration — loaded via `logger.configure()`

[logger]
format = "{time:YYYY-MM-DD HH:mm:ss.SSS} | {level: <8} | {name}:{function}:{line} | {message}"
level = "INFO"
rotation = "10 MB"
retention = "30 days"
compression = "gz"

[[handlers]]
sink = "logs/quant.log"
format = "{time:YYYY-MM-DD HH:mm:ss.SSS} | {level: <8} | {name}:{function}:{line} | {message}"
level = "INFO"

[[handlers]]
sink = "logs/errors.log"
format = "{time:YYYY-MM-DD HH:mm:ss.SSS} | {level: <8} | {name}:{function}:{line} | {message}"
level = "ERROR"

[[handlers]]
sink = "sys.stderr"
format = "<level>{level: <8}</level> | <level>{message}</level>"
level = "WARNING"
colorize = true
